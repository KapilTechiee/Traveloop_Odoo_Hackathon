<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traveloop Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
}

.container{
    width:950px;
    max-width:95%;
    height:620px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* LEFT */

.left{
    width:45%;
    background:#042f2e;
    color:white;
    padding:50px 40px;
    position:relative;
}

.left h1{
    font-size:55px;
    line-height:1.1;
    margin-top:80px;
    margin-bottom:25px;
}

.left span{
    color:#14b8a6;
}

.left p{
    color:#d1d5db;
    line-height:1.8;
    margin-bottom:70px;
}

.stats{
    display:flex;
    gap:30px;
}

.stats h2{
    font-size:35px;
}

.stats p{
    font-size:14px;
}

/* RIGHT */

.right{
    width:55%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.form-box{
    width:100%;
    max-width:400px;
}

.form-box h2{
    font-size:40px;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-group input:focus{
    border-color:#14b8a6;
}

.error{
    color:red;
    font-size:14px;
    margin-top:5px;
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    background:#14b8a6;
    color:white;
    font-size:17px;
    border-radius:12px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.login-btn:hover{
    background:#0f766e;
}

.signup-text{
    text-align:center;
    margin-top:20px;
}

.signup-text a{
    color:#14b8a6;
    text-decoration:none;
    font-weight:600;
}

@media(max-width:850px){

    .container{
        flex-direction:column;
        height:auto;
    }

    .left,
    .right{
        width:100%;
    }

    .left h1{
        font-size:40px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left">

        <h1>
            Every journey starts with a
            <span>single step.</span>
        </h1>

        <p>
            Plan dream trips, find travel companions,
            and explore the world — all in one beautiful place.
        </p>

        <div class="stats">

            <div>
                <h2>50K+</h2>
                <p>Travelers</p>
            </div>

            <div>
                <h2>120+</h2>
                <p>Countries</p>
            </div>

            <div>
                <h2>8K+</h2>
                <p>Groups</p>
            </div>

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right">

        <div class="form-box">

            <h2>Log In</h2>

            <p class="subtitle">
                Continue your adventure
            </p>

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="input-group">

                    <label>Email Address</label>

                    <input 
                        type="text"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <div class="error" id="emailError"></div>

                </div>

                <!-- PASSWORD -->

                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                    >

                    <div class="error" id="passwordError"></div>

                </div>

                <button type="submit" class="login-btn">
                    Log In
                </button>

            </form>

            <div class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </div>

        </div>

    </div>

</div>

<script>

const form = document.getElementById("loginForm");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    emailError.textContent = "";
    passwordError.textContent = "";

    let isValid = true;

    /* EMAIL VALIDATION */

    const emailPattern =
    /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if(email === ""){

        emailError.textContent =
        "Email is required";

        isValid = false;

    }
    else if(!emailPattern.test(email)){

        emailError.textContent =
        "Invalid email address";

        isValid = false;
    }

    /* PASSWORD VALIDATION */

    const passwordPattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if(password === ""){

        passwordError.textContent =
        "Password is required";

        isValid = false;
    }
    else if(!passwordPattern.test(password)){

        passwordError.textContent =
        "Password must contain:\n8 characters, uppercase, lowercase, number and special character";

        isValid = false;
    }

    /* SUCCESS */

    if(isValid){

        alert("Login Successful!");

        /* MOVE TO HOME PAGE */

        window.location.href = "index.html";
    }

});

</script>

</body>
</html>
