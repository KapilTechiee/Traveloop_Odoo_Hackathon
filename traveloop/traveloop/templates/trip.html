<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dynamic Travel Planner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f7f6;
    padding:30px;
}

.container{
    max-width:1300px;
    margin:auto;
    display:flex;
    gap:30px;
}

.left{
    width:40%;
    background:white;
    padding:30px;
    border-radius:20px;
}

.right{
    width:60%;
}

.title{
    font-size:45px;
    font-weight:bold;
}

.subtitle{
    color:gray;
    margin-top:10px;
    margin-bottom:30px;
}

.label{
    margin-top:25px;
    margin-bottom:10px;
    display:block;
    font-weight:bold;
}

.input,
select{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:18px;
}

.traveler-boxes{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

.traveler-card{
    flex:1;
    min-width:100px;
    border:1px solid #ccc;
    border-radius:12px;
    padding:20px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.active-card{
    border:2px solid #14b387;
    background:#ebfffa;
}

.emoji{
    font-size:30px;
    margin-bottom:10px;
}

.generate-btn{
    width:100%;
    margin-top:30px;
    padding:20px;
    border:none;
    background:#14b387;
    color:white;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}

.summary{

    background-size:cover;
    background-position:center;
    padding:30px;
    border-radius:20px;
    color:white;
    position:relative;
    overflow:hidden;
    transition:0.5s;
}

.summary::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:rgba(0,0,0,0.55);
}

.summary-content{
    position:relative;
    z-index:2;
}

.budget-grid{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    flex-wrap:wrap;
    gap:20px;
}

.budget-item p{
    font-size:28px;
    font-weight:bold;
}

.itinerary{
    background:white;
    padding:30px;
    border-radius:20px;
    margin-top:30px;
}

.city-title{
    font-size:35px;
    font-weight:bold;
    line-height:50px;
}

.date-text{
    margin-top:10px;
    color:gray;
    font-size:18px;
}

.timeline{
    margin-top:30px;
}

.activity{
    margin-top:30px;
    border-top:1px solid #eee;
    padding-top:20px;
}

.activity-title{
    font-size:28px;
    font-weight:bold;
}

.tag{
    display:inline-block;
    padding:8px 14px;
    background:#e6fff8;
    color:#14b387;
    border-radius:20px;
    margin-top:10px;
    margin-right:10px;
    font-weight:bold;
}

@media(max-width:1000px){

    .container{
        flex-direction:column;
    }

    .left,
    .right{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- LEFT PANEL -->

    <div class="left">

        <div class="title">
            Plan Your Trip
        </div>

        <div class="subtitle">
            Build your smart travel itinerary
        </div>

        <!-- DESTINATION -->

        <label class="label">
            Select Destination
        </label>

        <select id="destinationSelect"
                onchange="changeDestination()">

            <option value="india">
                India
            </option>

            <option value="maldives">
                Maldives
            </option>

            <option value="singapore">
                Singapore
            </option>

            <option value="thailand">
                Thailand
            </option>

            <option value="nepal">
                Nepal
            </option>

        </select>

        <!-- START DATE -->

        <label class="label">
            Travel Date
        </label>

        <input type="date"
               class="input"
               id="travelDate">

        <!-- RETURN DATE -->

        <label class="label">
            Return Date
        </label>

        <input type="date"
               class="input"
               id="returnDate">

        <!-- TRAVELERS -->

        <label class="label">
            Traveler Type
        </label>

        <div class="traveler-boxes">

            <div class="traveler-card active-card"
                 onclick="changeTraveler('solo', this)">

                <div class="emoji">🧍</div>

                Solo

            </div>

            <div class="traveler-card"
                 onclick="changeTraveler('couple', this)">

                <div class="emoji">👫</div>

                Couple

            </div>

            <div class="traveler-card"
                 onclick="changeTraveler('family', this)">

                <div class="emoji">👨‍👩‍👧</div>

                Family

            </div>

            <div class="traveler-card"
                 onclick="changeTraveler('group', this)">

                <div class="emoji">👥</div>

                Group

            </div>

        </div>

        <button class="generate-btn">
            Generate Trip
        </button>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right">

        <!-- SUMMARY -->

        <div class="summary" id="summaryBox">

            <div class="summary-content">

                <h1>
                    Budget Summary
                </h1>

                <div class="budget-grid">

                    <div class="budget-item">

                        <h3>Transport</h3>

                        <p id="transportPrice">
                            ₹0
                        </p>

                    </div>

                    <div class="budget-item">

                        <h3>Hotel</h3>

                        <p id="hotelPrice">
                            ₹0
                        </p>

                    </div>

                    <div class="budget-item">

                        <h3>Activities</h3>

                        <p id="activityPrice">
                            ₹0
                        </p>

                    </div>

                    <div class="budget-item">

                        <h3>Food</h3>

                        <p id="foodPrice">
                            ₹0
                        </p>

                    </div>

                </div>

            </div>

        </div>

        <!-- ITINERARY -->

        <div class="itinerary">

            <div class="city-title"
                 id="cityTitle">

            </div>

            <div class="date-text"
                 id="dateText">

                Select Date

            </div>

            <div class="timeline">

                <div class="activity">

                    <div class="activity-title"
                         id="act1">

                    </div>

                </div>

                <div class="activity">

                    <div class="activity-title"
                         id="act2">

                    </div>

                </div>

                <div class="activity">

                    <div class="activity-title"
                         id="act3">

                    </div>

                </div>

                <!-- ACTIVITIES TAGS -->

                <div id="activitiesBox">

                </div>

            </div>

        </div>

    </div>

</div>

            couple:{

            },

            family:{

            },

            group:{

            }

        },

        nepal: {

            solo:{
                transport:"₹8,000",

            },

            couple:{
                transport:"₹16,000",

        }

    };

    /* =====================================
       CHANGE TRAVELER
    ====================================== */

    window.changeTraveler = function(type, element){

        currentTraveler = type;

        const cards =
        document.querySelectorAll(".traveler-card");

        cards.forEach(card => {

            card.classList.remove("active-card");

        });

        element.classList.add("active-card");

        updateBudget();

    };

    /* =====================================
       UPDATE BUDGET
    ====================================== */

    function updateBudget(){

        const destination =
        document.getElementById("destinationSelect").value;

        const data =
        budgetData[destination][currentTraveler];

        document.getElementById("transportPrice")
        .innerText = data.transport;

        document.getElementById("hotelPrice")
        .innerText = data.hotel;

        document.getElementById("activityPrice")
        .innerText = data.activity;

        document.getElementById("foodPrice")
        .innerText = data.food;

    }

    /* =====================================
       CHANGE DESTINATION
    ====================================== */

    window.changeDestination = function(){

        const destination =
        document.getElementById("destinationSelect").value;

        const data =
        destinationData[destination];

        document.getElementById("cityTitle")
        .innerText = data.cities;

        document.getElementById("act1")
        .innerText = data.act1;

        document.getElementById("act2")
        .innerText = data.act2;

        document.getElementById("act3")
        .innerText = data.act3;

        /* CHANGE BACKGROUND IMAGE */

        document.getElementById("summaryBox")
        .style.backgroundImage =
        `url('${data.image}')`;

        let tagsHTML = "";

        data.activities.forEach(activity => {

            tagsHTML +=
            `<div class="tag">${activity}</div>`;

        });

        document.getElementById("activitiesBox")
        .innerHTML = tagsHTML;

        updateBudget();

    };

    /* =====================================
       DATE CHANGE
    ====================================== */

    const travelDate =
    document.getElementById("travelDate");

    const returnDate =
    document.getElementById("returnDate");

    function updateDateText(){

        const start =
        travelDate.value;

        const end =
        returnDate.value;

        if(start && end){

            document.getElementById("dateText")
            .innerText =
            "From " + start + " To " + end;

        }

    }

    travelDate.addEventListener(
        "change",
        updateDateText
    );

    returnDate.addEventListener(
        "change",
        updateDateText
    );

    /* =====================================
       INITIAL LOAD
    ====================================== */

    changeDestination();

};

</script>

</body>
</html>
